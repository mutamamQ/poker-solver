[project]
name = "poker-solver"
version = "0.1.0"
description = "Correctness-first finite-game Texas Hold'em reference solver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
poker-solver = "poker_solver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_solver"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exhaustive correctness tests"]
addopts = "--strict-markers"
